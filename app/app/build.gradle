plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.theguywhopaints.glow'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.theguywhopaints.glow'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Debug key: these builds are for sideloading, not for a store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Plain JVM tests for the colour picker (src/test); never in the APK.
    testImplementation 'junit:junit:4.13.2'
}
